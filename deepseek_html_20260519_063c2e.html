<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>RoXoL Browser</title>
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#07070f; overflow:hidden; font-family: 'Outfit', sans-serif; }
    #root { height:100vh; width:100vw; }
  </style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
  const { useState, useEffect, useRef } = React;

  // Fonts
  (() => {
    const l = document.createElement("link");
    l.rel = "stylesheet";
    l.href = "https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Outfit:wght@300;400;500;600;700&display=swap";
    document.head.appendChild(l);
  })();

  // Storage for bookmarks
  const storage = {
    async get(key) {
      try {
        const raw = localStorage.getItem(`roxol_${key}`);
        return raw ? JSON.parse(raw) : null;
      } catch { return null; }
    },
    async set(key, value) {
      try {
        localStorage.setItem(`roxol_${key}`, JSON.stringify(value));
      } catch(e) { console.warn(e); }
    }
  };

  const ROSE = "#8257e5";
  const GREEN = "#1bcc18";
  const BG = "#07070f";
  const BG2 = "#0d0d1a";
  const BG3 = "#121220";
  const GLASS = "rgba(255,255,255,0.04)";
  const BORDER = "rgba(255,255,255,0.08)";

  const STYLES = `
    @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.5; } }
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(130,87,229,0.4); border-radius: 4px; }
  `;

  const I = {
    star: "M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z",
    home: "M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z",
    plus: "M12 5v14 M5 12h14",
    trash: "M3 6h18 M8 6V4h8v2 M19 6l-1 14H6L5 6",
    x: "M18 6L6 18 M6 6l12 12",
    ext: "M18 13v6a2 2 0 01-2 2H5a2 2 0 01-2-2V8a2 2 0 012-2h6 M15 3h6v6 M10 14L21 3",
    refresh: "M23 4v6h-6 M1 20v-6h6 M3.51 9a9 9 0 0114.85-3.36L23 10 M1 14l4.64 4.36A9 9 0 0020.49 15",
    back: "M19 12H5 M12 19l-7-7 7-7",
    forward: "M5 12h14 M12 5l7 7-7 7",
  };

  const Ico = ({ d, size = 18, color = "currentColor", strokeWidth = 1.8 }) => (
    <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke={color} strokeWidth={strokeWidth} strokeLinecap="round" strokeLinejoin="round">
      {d.split(" M").map((p, i) => <path key={i} d={i === 0 ? p : "M" + p} />)}
    </svg>
  );

  const Btn = ({ children, onClick, color = ROSE, outline = false, small = false, style = {} }) => (
    <button onClick={onClick} style={{
      padding: small ? "6px 12px" : "8px 16px",
      background: outline ? "transparent" : color,
      border: `1px solid ${color}`,
      color: outline ? color : "#fff",
      borderRadius: 8, fontWeight: 500, fontSize: small ? 11 : 13,
      transition: "all 0.2s", cursor: "pointer", ...style
    }}>{children}</button>
  );

  const Input = ({ placeholder, value, onChange, style = {} }) => (
    <input placeholder={placeholder} value={value} onChange={onChange} style={{
      flex: 1, padding: "8px 12px", background: BG3, border: `1px solid ${BORDER}`,
      borderRadius: 10, color: "#f0f0f8", fontSize: 13, outline: "none", ...style
    }}
    onFocus={e => e.target.style.borderColor = ROSE}
    onBlur={e => e.target.style.borderColor = BORDER} />
  );

  const Card = ({ children }) => (
    <div style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 12, padding: 12 }}>{children}</div>
  );

  // Built-in Browser
  function BuiltInBrowser() {
    const [url, setUrl] = useState("https://animexin.dev");
    const [inputValue, setInputValue] = useState("https://animexin.dev");
    const [blocked, setBlocked] = useState(false);
    const [loading, setLoading] = useState(true);
    const [history, setHistory] = useState([]);
    const [historyIndex, setHistoryIndex] = useState(-1);
    const [bookmarks, setBookmarks] = useState([]);
    const [showBookmarks, setShowBookmarks] = useState(false);
    const [newBookmarkName, setNewBookmarkName] = useState("");
    const iframeRef = useRef(null);

    const BLOCK_LIST = ["youtube.com", "netflix.com", "spotify.com", "google.com", "facebook.com", "instagram.com", "twitter.com", "x.com", "twitch.tv"];

    useEffect(() => {
      storage.get("browser_bookmarks").then(b => setBookmarks(b || []));
    }, []);

    const isBlockedUrl = (u) => BLOCK_LIST.some(domain => u.includes(domain));

    const addToHistory = (newUrl) => {
      if (history[historyIndex] === newUrl) return;
      const newHistory = history.slice(0, historyIndex + 1);
      newHistory.push(newUrl);
      setHistory(newHistory);
      setHistoryIndex(newHistory.length - 1);
    };

    const navigate = (newUrl) => {
      let full = newUrl;
      if (!full.startsWith("http")) full = "https://" + full;
      if (isBlockedUrl(full)) {
        setBlocked(true);
        setUrl(full);
        setInputValue(full);
        setLoading(false);
      } else {
        setBlocked(false);
        setLoading(true);
        setUrl(full);
        setInputValue(full);
        addToHistory(full);
      }
      setShowBookmarks(false);
    };

    const goBack = () => {
      if (historyIndex > 0) {
        const prevUrl = history[historyIndex - 1];
        setHistoryIndex(historyIndex - 1);
        setUrl(prevUrl);
        setInputValue(prevUrl);
        setBlocked(isBlockedUrl(prevUrl));
        setLoading(!isBlockedUrl(prevUrl));
      }
    };

    const goForward = () => {
      if (historyIndex < history.length - 1) {
        const nextUrl = history[historyIndex + 1];
        setHistoryIndex(historyIndex + 1);
        setUrl(nextUrl);
        setInputValue(nextUrl);
        setBlocked(isBlockedUrl(nextUrl));
        setLoading(!isBlockedUrl(nextUrl));
      }
    };

    const refresh = () => {
      if (iframeRef.current) {
        iframeRef.current.src = iframeRef.current.src;
      }
    };

    const addBookmark = async () => {
      if (!newBookmarkName.trim()) return;
      const newBookmark = {
        id: Date.now().toString(),
        name: newBookmarkName,
        url: url,
        emoji: "🔖",
        createdAt: Date.now()
      };
      const updated = [...bookmarks, newBookmark];
      setBookmarks(updated);
      await storage.set("browser_bookmarks", updated);
      setNewBookmarkName("");
    };

    const deleteBookmark = async (id) => {
      const updated = bookmarks.filter(b => b.id !== id);
      setBookmarks(updated);
      await storage.set("browser_bookmarks", updated);
    };

    const loadBookmark = (bookmarkUrl) => {
      navigate(bookmarkUrl);
    };

    const handleIframeLoad = () => setLoading(false);
    const handleIframeError = () => { setBlocked(true); setLoading(false); };

    const quickSites = [
      { name: "AnimeXin", url: "https://animexin.dev", emoji: "🎌" },
      { name: "YouTube", url: "https://youtube.com", emoji: "▶️" },
      { name: "Spotify", url: "https://spotify.com", emoji: "🎵" },
      { name: "GitHub", url: "https://github.com", emoji: "🐙" },
      { name: "Reddit", url: "https://reddit.com", emoji: "🤖" },
      { name: "Twitter", url: "https://twitter.com", emoji: "🐦" },
    ];

    return (
      <div style={{ display: "flex", flexDirection: "column", height: "100vh", background: BG }}>
        {/* Toolbar */}
        <div style={{ padding: "10px 16px", background: BG2, borderBottom: `1px solid ${BORDER}`, display: "flex", alignItems: "center", gap: 8, flexWrap: "wrap" }}>
          <button onClick={goBack} disabled={historyIndex <= 0} style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: historyIndex <= 0 ? "#444" : "#ddd", cursor: historyIndex <= 0 ? "not-allowed" : "pointer" }}>
            <Ico d={I.back} size={14} />
          </button>
          <button onClick={goForward} disabled={historyIndex >= history.length - 1} style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: historyIndex >= history.length - 1 ? "#444" : "#ddd", cursor: historyIndex >= history.length - 1 ? "not-allowed" : "pointer" }}>
            <Ico d={I.forward} size={14} />
          </button>
          <button onClick={refresh} style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: "#ddd" }}>
            <Ico d={I.refresh} size={14} />
          </button>
          
          <div style={{ flex: 1, display: "flex", alignItems: "center", background: BG3, border: `1px solid ${BORDER}`, borderRadius: 10, padding: "4px 12px" }}>
            <span style={{ marginRight: 6, fontSize: 12 }}>🔒</span>
            <input value={inputValue} onChange={e=>setInputValue(e.target.value)} onKeyDown={e=>e.key==="Enter"&&navigate(inputValue)} style={{ flex:1, background:"none", border:"none", color:"#f0f0f8", fontSize: 13, outline:"none" }} placeholder="Enter URL..." />
          </div>
          
          <button onClick={() => navigate(inputValue)} style={{ padding:"6px 14px", background: `${GREEN}22`, border:`1px solid ${GREEN}44`, borderRadius: 8, color: GREEN, fontSize: 12, fontWeight: 500 }}>Go</button>
          
          <button onClick={() => window.open(url, "_blank")} style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 8, padding: "6px 10px", color: "#aaa" }} title="Open in new tab">
            <Ico d={I.ext} size={14} />
          </button>
          
          <button onClick={() => setShowBookmarks(!showBookmarks)} style={{ background: showBookmarks ? `${ROSE}22` : GLASS, border: `1px solid ${showBookmarks ? ROSE : BORDER}`, borderRadius: 8, padding: "6px 10px", color: showBookmarks ? ROSE : "#aaa" }}>
            <Ico d={I.star} size={14} />
          </button>
        </div>

        {/* Bookmarks Panel */}
        {showBookmarks && (
          <div style={{ background: BG2, borderBottom: `1px solid ${BORDER}`, padding: "12px 16px", maxHeight: 200, overflowY: "auto" }}>
            <div style={{ display: "flex", gap: 8, marginBottom: 12, alignItems: "center" }}>
              <Input placeholder="Bookmark name..." value={newBookmarkName} onChange={e=>setNewBookmarkName(e.target.value)} style={{ width: 200 }} />
              <Btn onClick={addBookmark} small>+ Bookmark Current Page</Btn>
            </div>
            {bookmarks.length === 0 && <div style={{ fontSize: 12, color: "#666", textAlign: "center", padding: 8 }}>No bookmarks yet. Click + to save this page.</div>}
            <div style={{ display: "flex", gap: 8, flexWrap: "wrap" }}>
              {bookmarks.map(b => (
                <div key={b.id} style={{ display: "flex", alignItems: "center", gap: 6, background: BG3, padding: "4px 10px", borderRadius: 20, border: `1px solid ${BORDER}` }}>
                  <span style={{ fontSize: 14 }}>🔖</span>
                  <button onClick={() => loadBookmark(b.url)} style={{ background: "none", border: "none", color: "#ddd", fontSize: 12, cursor: "pointer" }}>{b.name}</button>
                  <button onClick={() => deleteBookmark(b.id)} style={{ background: "none", border: "none", color: "#ff4757", cursor: "pointer", fontSize: 12 }}>✕</button>
                </div>
              ))}
            </div>
          </div>
        )}

        {/* Quick Sites Row */}
        <div style={{ padding: "8px 16px", background: BG3, borderBottom: `1px solid ${BORDER}`, display: "flex", gap: 8, overflowX: "auto" }}>
          {quickSites.map(site => (
            <button key={site.name} onClick={() => navigate(site.url)} style={{ background: GLASS, border: `1px solid ${BORDER}`, borderRadius: 20, padding: "4px 12px", fontSize: 12, color: "#aaa", cursor: "pointer", whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 4 }}>
              <span>{site.emoji}</span> {site.name}
            </button>
          ))}
        </div>

        {/* Browser iframe area */}
        <div style={{ flex: 1, position: "relative" }}>
          {loading && !blocked && (
            <div style={{ position: "absolute", inset: 0, background: BG, display: "flex", alignItems: "center", justifyContent: "center", zIndex: 10 }}>
              <div style={{ textAlign: "center" }}>
                <div style={{ width: 40, height: 40, border: `3px solid ${BORDER}`, borderTop: `3px solid ${GREEN}`, borderRadius: "50%", animation: "spin 0.8s linear infinite", margin: "0 auto 12px" }} />
                <div style={{ color: "#888", fontSize: 13 }}>Loading page...</div>
              </div>
            </div>
          )}
          
          {blocked ? (
            <div style={{ display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", height: "100%", padding: 32, textAlign: "center" }}>
              <div style={{ fontSize: 56, marginBottom: 16 }}>🚫</div>
              <div style={{ fontSize: 20, fontFamily: "'Orbitron',sans-serif", color: "#f0f0f8", marginBottom: 8 }}>Site blocks embedding</div>
              <div style={{ color: "#aaa", maxWidth: 420, marginBottom: 20 }}>Most streaming platforms (YouTube, Netflix, etc.) prevent being displayed inside iframes for security reasons.</div>
              <div style={{ display: "flex", gap: 12 }}>
                <Btn onClick={() => window.open(url, "_blank")}>Open in New Tab ↗</Btn>
                <Btn onClick={() => navigate("https://animexin.dev")} outline>Go to AnimeXin</Btn>
              </div>
              <div style={{ marginTop: 20, fontSize: 12, color: "#555", wordBreak: "break-all" }}>URL: {url}</div>
            </div>
          ) : (
            <iframe
              ref={iframeRef}
              src={url}
              title="RoXoL Browser"
              style={{ width: "100%", height: "100%", border: "none" }}
              onLoad={handleIframeLoad}
              onError={handleIframeError}
              sandbox="allow-same-origin allow-scripts allow-popups allow-forms allow-popups-to-escape-sandbox allow-presentation allow-modals"
              allow="autoplay; fullscreen; picture-in-picture"
            />
          )}
        </div>
      </div>
    );
  }

  const root = ReactDOM.createRoot(document.getElementById('root'));
  root.render(<BuiltInBrowser />);
</script>
</body>
</html>
